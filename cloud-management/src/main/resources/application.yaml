app:
  #启动后请修改系统配置项default.cluster.manager.uri,不能使用localhost或者127.0.0.1
  manager-uri: http://192.168.2.102:8080/
  task:
    thread:
      size: 8
  work:
    thread:
      size: 4

server:
  port: 8080
  servlet:
    context-path: /
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.100:3306/cj_kvm_cloud?characterEncoding=utf8&characterSetResults=utf8&autoReconnect=true&failOverReadOnly=false&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true
    username: kvm-cloud
    password: KvmCloud@123456
    initialization-mode: always
    schema: classpath:/schema-mysql.sql
    continue-on-error: false
    hikari:
      minimum-idle: 8
      maximum-pool-size: 16
      idle-timeout: 300000
      connection-timeout: 60000
      max-lifetime: 1800000
